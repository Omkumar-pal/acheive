name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform Configuration
        run: |
          flutter create --platforms=android --org com.achieve.app .
          flutter clean
          flutter pub get

      - name: Run Unit Tests
        run: |
          flutter test test/unit/progress_calculator_test.dart
          flutter test test/unit/consistency_evaluator_test.dart

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: achieve-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
